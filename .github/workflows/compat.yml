name: compat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compat:
    name: cross-impl compat (linux / upstream zsync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install upstream zsync (C reference)
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          zsync -V || true
          zsyncmake -V || true

      - name: Compat tests
        run: go test -v -tags=compat ./internal/zsync/...

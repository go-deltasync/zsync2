name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.1"]
        # ⛔ macOS + Go 1.22 cannot LINK this module's tests any more, and has
        # not since at least 2026-08-27. dyld refuses every test binary with
        # "missing LC_UUID load command" before a single test runs.
        #
        # Measured rather than guessed, because the obvious explanations are
        # all wrong:
        #   - not the runner image or the Go patch: go-deltasync/rdiff passes
        #     the SAME cell, same macos-26-arm64, same go1.22.12, re-run today;
        #   - not LC_UUID: the accepted binaries have none either (`otool -l`),
        #     so dyld's own message names something that is true of all of them;
        #   - not the SDK stamp: rdiff forced to external linking gets the same
        #     `minos 26.0 / sdk 27.0` and still runs.
        #
        # What is left is the combination. This module imports net/http, which
        # pulls crypto/x509, which on darwin calls Security and CoreFoundation
        # through cgo — so the link is EXTERNAL and the binary carries two
        # system frameworks. Go 1.23 links the same package set internally
        # (`minos 11.0`) and runs. rdiff links no framework and runs either way.
        # `-ldflags=-linkmode=internal` does not help: with cgo present it falls
        # straight back to external, which is how it was mistaken for a fix.
        #
        # ⚠ The paragraph above is HISTORY as of #8, which raised the floor to
        # 1.27.1. It used to end "1.22 is the floor go.mod declares and it stays
        # tested — on ubuntu and windows, where it passes", and both halves of
        # that stopped being true the moment the directive moved: go.mod no
        # longer declares 1.22, and the matrix no longer runs it anywhere. The
        # `exclude:` that went with it named a cell the matrix no longer
        # produces, so it was removed rather than left to look like a live rule.
        #
        # The finding itself is kept because it costs nothing and is hard-won:
        # should the floor ever go back below 1.23, macOS will need that cell
        # excluded again, for the reason set out above.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Without this the matrix cannot be wrong, because go satisfies a
      # directive it is too old for by DOWNLOADING a newer toolchain -- the leg
      # keeps printing the version it asked for while running another one.
      # Measured in the sibling repository go-deltasync/rdiff, whose job named
      # "test (macos-latest / go1.22)" printed "Setup go version spec 1.22"
      # and then "go version go1.27.1". With GOTOOLCHAIN=local a leg below the
      # directive fails outright instead.
      - name: Refuse a toolchain other than the one this leg asked for
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Show Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          go test -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tee cover.txt
          # The CLIs in cmd/ are thin wrappers around the internal package
          # and intentionally have no unit tests; we enforce 100% coverage
          # on the library (internal/zsync) only, which is where the
          # protocol-correctness logic lives.
          pkg_cov=$(go test -coverprofile=cover-pkg.out ./internal/zsync >/dev/null 2>&1 && \
                    go tool cover -func=cover-pkg.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "internal/zsync coverage: ${pkg_cov}%"
          awk -v t="$pkg_cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::internal/zsync coverage ${pkg_cov}% < 100%"; exit 1; }

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cover-${{ matrix.os }}-go${{ matrix.go }}
          path: cover.out
          if-no-files-found: warn
